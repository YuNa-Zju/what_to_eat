# Replace the hostname and TLS certificate paths before use.
server {
    listen 80;
    server_name food.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name food.example.com;
    ssl_certificate /etc/letsencrypt/live/food.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/food.example.com/privkey.pem;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
